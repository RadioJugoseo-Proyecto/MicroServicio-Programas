spring.application.name=programas
server.port=8082

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/radiojugoseo_programas
spring.datasource.username=jugoseo_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Zona horaria de la radio (para "programas al aire")
jugoseo.zona-horaria=America/Santiago

# Simulación de transmisión
# factor-velocidad: 1 segundo real = N segundos simulados (60 => 1 hora de programa dura 1 minuto)
jugoseo.simulacion.factor-velocidad=60
jugoseo.simulacion.intervalo-ms=5000
jugoseo.simulacion.oyentes-base=50
